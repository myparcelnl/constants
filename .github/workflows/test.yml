name: 'Run tests 🧪'

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: 'Run tests'
        shell: bash
        run: pnpm test:coverage

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: 'Run publint'
        shell: bash
        run: pnpm exec publint
