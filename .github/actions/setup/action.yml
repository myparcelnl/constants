name: 'Setup'
description: 'Install node dependencies and create build'

runs:
  using: composite
  steps:
    - uses: pnpm/setup@v3
      with:
        cache: true
        require-lockfile: true

    - name: 'Cache build'
      uses: actions/cache@v6
      with:
        path: dist
        key: ${{ runner.os }}-build-${{ hashFiles('package.json', 'pnpm-lock.yaml', 'src/**', 'tsup.config.ts', 'tsconfig*.json') }}

    - shell: bash
      run: pnpm run build
